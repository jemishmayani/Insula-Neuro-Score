<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Insula Neuro Score</title>
<link rel="stylesheet" href="css/app.css">
<script>
/* Apply theme before first paint to avoid a flash. */
(function(){try{var p=JSON.parse(localStorage.getItem("ins.prefs")||"{}");var t=p.theme||"system";
var d=t==="dark"||(t==="system"&&matchMedia("(prefers-color-scheme: dark)").matches);
document.documentElement.setAttribute("data-theme",d?"dark":"light");
if(p.highContrast)document.documentElement.setAttribute("data-contrast","high");}catch(e){}})();
</script>
</head>
<body>
<header class="appbar" id="appbar"></header>
<main id="main" tabindex="-1"></main>
<nav class="tabbar" id="tabbar" aria-label="Primary"></nav>
<div id="live" class="vh" aria-live="polite"></div>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
