<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'">
<title>Insula Neuro Score</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/components.css">
<script>
/* Apply the saved theme before first paint (no flash of the wrong theme). */
(function () {
  try {
    var s = JSON.parse(localStorage.getItem("ins.store.v2") || localStorage.getItem("ins.prefs") || "{}");
    var t = s.theme || "system";
    var dark = t === "dark" || (t === "system" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    if (s.highContrast) document.documentElement.setAttribute("data-contrast", "high");
  } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
})();
</script>
</head>
<body>
<div id="app"></div>
<div id="live" class="vh" aria-live="polite" aria-atomic="true"></div>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/engine/expr.js"></script>
<script src="js/engine/inputs.js"></script>
<script src="js/engine/insights.js"></script>
<script src="js/engine/engine.js"></script>
<script src="js/calculator.js"></script>
<script src="js/app.js"></script>
</body>
</html>
